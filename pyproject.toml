[project]
name = "century-pano"
version = "0.1.0"
description = "Step into another decade through your own panorama"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1",
  "python-multipart>=0.0.20", "pillow>=11", "pillow-heif>=0.21",
  "numpy>=2", "scikit-image>=0.24", "reverse_geocoder>=1.5.1",
  "python-dotenv>=1", "qrcode[pil]>=8"
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#32372f">
  <meta name="description" content="让手机成为时间的视窗。全屏探索同一个地方的另一个年代。">
  <title>CENTURY PANO · 时间视窗</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2332372f'/%3E%3Cpath d='M7 13V7h6m6 0h6v6M7 19v6h6m6 0h6v-6' stroke='white' stroke-width='1.5' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="icon-defs" aria-hidden="true"><defs>
    <symbol id="i-window" viewBox="0 0 24 24"><path d="M3 9V3h6m6 0h6v6M3 15v6h6m6 0h6v-6"/></symbol>
    <symbol id="i-location" viewBox="0 0 24 24"><path d="M18 10c0 4-6 10-6 10S6 14 6 10a6 6 0 1 1 12 0Z"/><circle cx="12" cy="10" r="2"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m4 17 5-5 4 4 3-3 5 5"/><circle cx="8" cy="9" r="1.5"/></symbol>
    <symbol id="i-compare" viewBox="0 0 24 24"><path d="M12 2v20M8 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3m8-14h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-3"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 9a8 8 0 1 1 1 8M4 4v5h5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
  </defs></svg>

  <main class="window" aria-label="时间全景视窗">
    <div class="landscape" id="landscape" tabindex="0" aria-label="全屏全景，左右拖动或使用方向键探索">
      <img id="present-image" src="../assets/pittsburgh.png" alt="匹兹堡河岸与金色桥梁的概念全景" draggable="false">
      <div class="past-layer" id="past-layer" aria-hidden="true"><img id="past-image" src="../assets/pittsburgh.png" alt="" draggable="false"></div>
    </div>
    <div class="screen-shade" aria-hidden="true"></div>

    <header class="topbar chrome">
      <span class="wordmark" aria-label="CENTURY PANO"><svg><use href="#i-window"/></svg><span>CENTURY<span class="wordmark-light"> PANO</span></span></span>
      <div class="place"><svg><use href="#i-location"/></svg><span id="place-name">Pittsburgh</span></div>
      <button class="round-button menu-button" id="menu-button" aria-label="视窗选项" aria-haspopup="dialog"><svg><use href="#i-more"/></svg></button>
    </header>

    <div class="compare-labels chrome" id="compare-labels" hidden><span><i></i><span id="past-label-year">1920</span></span><span>现在 <i></i></span></div>
    <div class="compare-control" id="compare-control" hidden>
      <div class="compare-line" aria-hidden="true"></div>
      <div class="compare-grip" id="compare-grip" role="slider" tabindex="0" aria-label="过去影像显示比例" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span aria-hidden="true">‹</span><i aria-hidden="true"></i><span aria-hidden="true">›</span></div>
    </div>

    <div class="gesture-hint chrome" id="gesture-hint"><span aria-hidden="true">↔</span> 左右滑动，探索此地</div>

    <section class="time-controls chrome" aria-label="年代与视窗控制">
      <div class="time-caption"><p id="time-description">同一个地方，另一个年代。</p><h1><span id="year-display">1920</span><span class="year-suffix" id="year-suffix">s</span></h1></div>
      <div class="era-picker" role="group" aria-label="选择年代">
        <button data-era="1900" aria-pressed="false">1900<span class="era-dot"></span></button>
        <button data-era="1920" aria-pressed="true" class="active">1920<span class="era-dot"></span></button>
        <button data-era="1950" aria-pressed="false">1950<span class="era-dot"></span></button>
        <button data-era="1970" aria-pressed="false">1970<span class="era-dot"></span></button>
        <button data-era="now" aria-pressed="false">现在<span class="era-dot"></span></button>
      </div>
      <div class="action-row">
        <button class="subtle-button" id="upload-button"><svg><use href="#i-image"/></svg><span>换张全景</span></button>
        <button class="quiet-button" id="clean-button" aria-label="进入纯净模式，隐藏界面" title="纯净模式"><svg><use href="#i-window"/></svg></button>
        <button class="subtle-button" id="compare-button" aria-pressed="false"><svg><use href="#i-compare"/></svg><span>今昔对比</span></button>
      </div>
      <p class="concept-note" id="concept-note">概念影像 · 年代色调演示</p>
    </section>

    <button class="round-button restore-button" id="restore-button" aria-label="退出纯净模式，显示界面" hidden><svg><use href="#i-eye"/></svg></button>
  </main>

  <dialog class="options-sheet" id="options-sheet" aria-labelledby="options-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-heading"><div><p>CENTURY PANO</p><h2 id="options-title">你的时光视窗</h2></div><button class="sheet-close" id="close-sheet" aria-label="关闭选项"><svg><use href="#i-close"/></svg></button></div>
    <div class="sheet-actions">
      <button id="sheet-upload"><svg><use href="#i-image"/></svg><span>换一张自己的照片<small id="file-label">全景照片，会更开阔。</small></span><svg class="sheet-arrow"><use href="#i-arrow"/></svg></button>
      <button id="sheet-clean"><svg><use href="#i-window"/></svg><span>只看风景<small>隐藏界面，留一扇完整的视窗。</small></span><svg class="sheet-arrow"><use href="#i-arrow"/></svg></button>
      <button id="reset-button"><svg><use href="#i-reset"/></svg><span>回到最初的视角<small>恢复概念全景与 1920 年代。</small></span><svg class="sheet-arrow"><use href="#i-arrow"/></svg></button>
    </div>
    <div class="sheet-footnote"><p>照片仅在本机预览。当前年代效果为色调演示，概念影像并非真实历史照片。</p><a href="../" target="_top">查看其他设计 <span>↗</span></a></div>
  </dialog>
  <input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" aria-label="选择本地全景照片" hidden>
  <div class="toast" id="toast" role="status" hidden></div>
  <noscript><p class="noscript">开启 JavaScript 后，即可拖动全景、选择年代和载入照片。</p></noscript>
</body>
</html>
